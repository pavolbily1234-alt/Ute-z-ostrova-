<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Útěk z ostrova</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(#168aad, #52b788);
  color: white;
  text-align: center;
}

#game {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

h1 {
  font-size: 34px;
}

#island {
  font-size: 90px;
  margin: 20px;
}

.stats {
  display: flex;
  justify-content: space-around;
  font-size: 20px;
  margin: 15px 0;
}

button {
  font-size: 19px;
  padding: 14px 20px;
  margin: 7px;
  border: none;
  border-radius: 15px;
  background: #ffd166;
  cursor: pointer;
}

button:active {
  transform: scale(0.95);
}

#message {
  min-height: 55px;
  font-size: 19px;
  font-weight: bold;
}

.hidden {
  display: none;
}

.win {
  font-size: 28px;
}

.lose {
  font-size: 28px;
}
</style>
</head>

<body>

<div id="game">

<h1>🏝️ ÚTĚK Z OSTROVA</h1>

<p id="message">
Jsi uvězněný na ostrově. Musíš najít klíč a lo
